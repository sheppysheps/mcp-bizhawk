# movie_recorder config. Copy this file to movie_recorder.cfg next to
# movie_recorder.lua and edit it. Plain "key = value" lines; '#' starts a comment.
# The recorder never executes this file.

# Output folder. It must already exist; files in it are overwritten.
out = C:/path/to/exports/my-movie

# Memory domains to dump at snapshot frames. Names vary by core: use the
# list from BizHawk (Tools > Hex Editor > Memory) or a probe script.
# Game Boy (Gambatte): WRAM, HRAM, VRAM, OAM, CartRAM, ROM, System Bus
domains = WRAM, HRAM, VRAM, OAM

# Snapshot every N frames (0 = off) and/or at listed frames (decimal or 0x hex).
snapshot_every = 1000
snapshot_frames = 147, 386, 689

# Dense snapshots in a window: "<start> <end> <step>" (repeatable), and stop
# the recording after a frame (0 = play to the end). Together they study one
# stretch of a long movie quickly, e.g. transitions seen at frames ~1000-1600.
# snapshot_range = 1000 1600 5
# stop_after = 1700

# Checkpoints. save_states writes state_f<frame>.State into `out` at those
# frames. A later pass sets start_state to one of them: the recorder loads it
# at startup (the movie must already be playing, read-only), BizHawk continues
# the movie from that frame, and recording starts there. Verify a checkpoint
# once with movie_export compare against a pass from frame 0. Savestates are
# game data: keep them out of git (the asset guard blocks *.State).
# save_states_every N saves one every N frames as well. Size depends on the
# BizHawk version: each state holds the movie's whole input log, and on 1.11.7
# a state of a 284,015-frame movie was ~3.8 MB (1,000-frame spacing: ~1.1 GB
# for the movie; 5,000: ~215 MB). Any frame is at most N-1 frames of turbo
# from a checkpoint.
# save_states = 50000, 195000
# save_states_every = 1000
# start_state = C:/path/to/exports/my-movie/state_f0195000.State

# Save a screenshot at every snapshot frame.
screenshots = true

# Write-watches on System Bus addresses: "<start> <length>". Each watched byte
# costs a callback, so keep ranges narrow (the total is capped by
# max_watch_bytes). Logs frame, address, old -> new value and the writing PC.
# watch = 0xC000 0x0100
#
# Add "registers" (and optionally the stack/capture/max options described
# under exec_watch below) to also log every write to the range with the CPU
# registers at that moment, to write_hits.tsv. A copy routine's registers
# show where it copies from (e.g. HL/DE on Game Boy).
# watch = 0xC000 0x10 registers stack 2 max 500

# Watch bytes AND take a snapshot + screenshot <delay> frames after any of them
# changes (default 30, so the new screen has finished drawing). Point it at a
# game's "current room / map" variable to get one picture per room visited.
# snapshot_on_change = 0xC9F9 2 30
max_watch_bytes = 4096

# Run unthrottled, and close BizHawk when the movie ends.
turbo = true
exit_at_end = false

# Write buffered rows to disk every N frames.
flush_every = 600

# Print a progress line in the Lua Console every N frames (0 = off). The
# recorder also prints a RECORDING banner at the start: if the console stays
# silent, the script isn't running (check it's switched on in the Lua Console).
progress_every = 10000

# Exec-watches: log the CPU registers each time an address executes, to
# execs.tsv. Point one at a routine that copies or reads a table: its address
# registers (e.g. HL/DE on Game Boy) then show where the table is.
#   stack <words>             also log that many 2-byte words at SP (the return
#                             addresses, i.e. who called the routine), max 16
#   capture <start> <length>  also log these System Bus bytes, max 64 per range,
#                             repeatable (e.g. the game's "current ROM bank" copy)
#   max <hits>                log at most this many hits for the address (default
#                             1000; later hits are only counted, see run.tsv)
# A writer PC from writes.tsv may be the instruction after the write, so watch
# a few addresses just before it too. Up to 32 exec_watch lines.
# Not every core fires execute callbacks: on BizHawk 1.11.7 with Gambatte they
# register without error and never fire. Check execs.tsv early in a run; if it
# stays empty, use "watch ... registers" on the data the code writes instead.
# exec_watch = 0x0150 stack 2 capture 0xFF80 0x10 max 500

# Diagnostics, written to movie_recorder.log next to the script (not the
# console). heartbeat_every N logs a line every N frames (0 = off), so the
# log's last line brackets where a hang or crash happened. trace_snapshots
# logs each snapshot step (start, each domain, screenshot, done).
heartbeat_every = 0
trace_snapshots = true
