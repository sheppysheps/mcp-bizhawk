name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
        # One macOS job instead of three: GitHub's macOS runners are scarce and
        # jobs waited 7-15 minutes for a machine (one never got one and was
        # cancelled), while the tests run in ~20 s. Node 22 and 26 stay covered
        # on Linux and Windows; macOS keeps the LTS release for OS-specific
        # behavior (paths, sockets, permissions).
        exclude:
          - os: macos-latest
            node: 22
          - os: macos-latest
            node: 26

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type-check & build
        run: npm run build

      - name: Verify shebang and bin
        shell: bash
        run: |
          head -1 dist/index.js | grep -q '^#!/usr/bin/env node$'
          test -f dist/index.js
          test -f dist/bizhawk.js
          test -f dist/tools.js
          echo "build artifacts OK"

      - name: Unit tests (Node)
        run: node --test test/node/*.test.mjs

  lua:
    name: lua tests (5.4 on ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.4 (BizHawk 2.11 embeds 5.4)
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Sandbox, consent gate and json.lua checks
        run: lua5.4 test/lua/run.lua

  skills:
    name: skill tests (python on ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: tile-graphics unit tests (standard library only)
        run: python3 -m unittest discover -s skills/tile-graphics/tests -v

  ci-ok:
    name: ci-ok
    needs: [build, lua, skills]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Verify all matrix builds and the Lua tests passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "matrix build did not fully succeed: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.lua.result }}" != "success" ]; then
            echo "lua tests did not succeed: ${{ needs.lua.result }}"
            exit 1
          fi
          if [ "${{ needs.skills.result }}" != "success" ]; then
            echo "skill tests did not succeed: ${{ needs.skills.result }}"
            exit 1
          fi
          echo "all matrix builds and lua tests passed"
