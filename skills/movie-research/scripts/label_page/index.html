<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labeling Station</title>
<link rel="stylesheet" href="/label.css">
<script src="/label.js" defer></script>
</head>
<body>
<header>
  <h1>Labeling Station</h1>
  <span id="folder"></span>
  <label><input type="checkbox" id="unlabeled"> unlabeled only</label>
  <select id="guess-filter" aria-label="Filter by guessed method">
    <option value="">all methods</option>
  </select>
  <span class="add"><input id="add-frame" type="number" min="0" placeholder="frame" aria-label="Frame for a new event">
  <button type="button" id="add-event" title="For a transition the list misses: adds an event at that frame">Add event</button></span>
  <button type="button" id="fill-none" title="In labeled events (with a kind), empty requirement fields (this way, the other way, leaving) get &quot;none&quot;">Fill "none" in labeled events</button>
  <span id="status" role="status">loading</span>
</header>
<main>
  <nav id="list" aria-label="Events"></nav>
  <section id="detail">
    <div id="position"></div>
    <div class="shots">
      <figure><img id="shot-before" alt="Screenshot before"><figcaption id="cap-before">before</figcaption></figure>
      <figure><img id="shot-after" alt="Screenshot after"><figcaption id="cap-after">after</figcaption></figure>
    </div>
    <h2>Places</h2>
    <p class="hint">Name each new value once; later visits to the same value show the name.</p>
    <div id="changes"></div>
    <h2>Transition</h2>
    <div class="form">
      <label class="wide">Arrived in (the place in the after shot, whatever the values say)
        <input id="arrival" list="arrival-names" placeholder="e.g. Dribble Fountain: lobby"></label>
      <datalist id="arrival-names"></datalist>
      <label>Exit door (at the origin) <input id="exit_door" list="door-names" placeholder="e.g. east door, top ladder">
        <span class="presets" id="exit_door-presets"></span></label>
      <label>Entry door (at the arrival) <input id="entry_door" list="door-names" placeholder="e.g. west door, bottom">
        <span class="presets" id="entry_door-presets"></span></label>
      <datalist id="door-names"></datalist>
      <label>Kind <select id="kind"></select></label>
      <label>Exit method (at the origin) <select id="exit"></select></label>
      <label>Entry state (on arrival) <select id="entry"></select></label>
      <label>Requires <input id="requires" placeholder="none, or tick below / type, comma-separated"></label>
      <div class="wide" id="require-boxes" aria-label="Requirements"></div>
      <label>Requires the other way (arrival → origin) <input id="requires_back" placeholder="empty if unknown; none, or comma-separated"></label>
      <label>To leave the arrival room <input id="leave_requires" placeholder="e.g. Monkey to climb out if you fall"></label>
      <label class="wide">Notes <textarea id="notes" rows="3"></textarea></label>
    </div>
    <p class="hint">Keys: <kbd>j</kbd> previous, <kbd>k</kbd> next (outside text fields). Changes save automatically.</p>
  </section>
</main>
</body>
</html>
